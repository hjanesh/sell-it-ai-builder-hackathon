# Render Blueprint: New → Blueprint → pick this repo. Fill the sync:false values in the dashboard.
services:
  - type: web
    name: sell-it
    runtime: node
    plan: free # switch to starter once Render credits are on the account (free sleeps after 15 min idle)
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Public keys are baked in at build time: after changing them, redeploy.
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: NEXT_PUBLIC_UPI_VPA
        sync: false
